async function saveSite(){const val=(id)=>document.getElementById(id)?.value||'';const chk=(id)=>document.getElementById(id)?.checked? '1':'0';const items=[['site.brand_mark',val('st_brand_mark')],['site.loader_mark',val('st_loader_mark')],['site.brand_logo_url',val('st_brand_logo')],['site.loader_logo_url',val('st_loader_logo')],['site.portrait_url',val('st_portrait')],['site.favicon_url',val('st_favicon')],['site.title',val('st_title')],['site.meta_description',val('st_desc')],['site.accent_color',val('st_accent')],['site.effects_enabled',chk('st_effects')],['contact.email',val('st_email')],['contact.linkedin',val('st_linkedin')],['contact.whatsapp',val('st_whatsapp')],['contact.facebook',val('st_facebook')],['social.email.visible',chk('vis_email')],['social.linkedin.visible',chk('vis_linkedin')],['social.whatsapp.visible',chk('vis_whatsapp')],['social.facebook.visible',chk('vis_facebook')],['insights.cta_url',val('st_cta')],['insights.cta_visible',chk('vis_cta')]].map(x=>({key:x[0],en:x[1],ar:x[1]}));try{await api('/api/settings',{method:'PUT',body:JSON.stringify(items)});alert('تم حفظ إعدادات الموقع بنجاح.');}catch(e){alert(e.message)}}
async function saveContact(){const vals=[['contact.email',document.getElementById('ct_email').value],['contact.linkedin',document.getElementById('ct_linkedin').value],['contact.whatsapp',document.getElementById('ct_whatsapp').value],['contact.facebook',document.getElementById('ct_facebook').value],['site.portrait_url',document.getElementById('ct_portrait').value],['site.favicon_url',document.getElementById('ct_favicon').value]].map(x=>({key:x[0],en:x[1],ar:x[1]}));try{await api('/api/settings',{method:'PUT',body:JSON.stringify(vals)});alert('تم الحفظ.');}catch(e){alert(e.message)}}
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
boot();</script></body></html>
