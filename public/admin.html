function makeSlug(v){return String(v||'').trim().toLowerCase().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')}

function partRowHtml(kind,item){const x=item||{};return '<div class="part-row"><div><label>English Name</label><input data-part="name_en" value="'+esc(x.name_en||'')+'" placeholder="Assumptions"></div><div><label>الاسم بالعربي</label><input data-part="name_ar" value="'+esc(x.name_ar||'')+'" placeholder="الافتراضات"></div><div><label>Preview Image URL</label><input data-part="image_url" value="'+esc(x.image_url||'')+'" placeholder="https://..."></div><button type="button" class="part-remove" onclick="this.parentElement.remove()">حذف</button></div>'}
function renderPartsEditor(kind,raw){const el=document.getElementById(kind==='model'?'modelPartsEditor':'dashboardPartsEditor');if(!el)return;const a=parseParts(raw);el.innerHTML=a.map(x=>partRowHtml(kind,x)).join('');}
function addPartRow(kind){const el=document.getElementById(kind==='model'?'modelPartsEditor':'dashboardPartsEditor');if(el)el.insertAdjacentHTML('beforeend',partRowHtml(kind,{}));}
function collectParts(kind){const el=document.getElementById(kind==='model'?'modelPartsEditor':'dashboardPartsEditor');if(!el)return[];return Array.from(el.querySelectorAll('.part-row')).map(r=>{const o={};r.querySelectorAll('[data-part]').forEach(i=>o[i.getAttribute('data-part')]=i.value.trim());return o}).filter(x=>x.name_en||x.name_ar||x.image_url);}
function vals(){const c=configs[current],o={};c.fields.forEach(f=>{const el=document.getElementById('f_'+f[0]);if(!el)return;o[f[0]]=f[2]==='number'?Number(el.value)||0:f[2]==='checkbox'?el.checked:el.value});if(editing?.slug)o.slug=editing.slug;else{o.slug=makeSlug(o.title_en||o.name_en||o.label_en||o.title_ar||o.name_ar||o.label_ar)||('item-'+Date.now())}if(current==='videos'&&!o.thumbnail_url&&o.url){const m=String(o.url).match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);if(m)o.thumbnail_url='https://img.youtube.com/vi/'+m[1]+'/hqdefault.jpg'}o.published=document.getElementById('f_published').checked;if(document.getElementById('f_featured'))o.featured=document.getElementById('f_featured').checked;if(current==='projects'){o.model_parts=JSON.stringify(collectParts('model'));o.dashboard_parts=JSON.stringify(collectParts('dashboard'));}return o}

async function toggleRow(id,published){
      try{
        const r=await api('/api/publish',{method:'POST',body:JSON.stringify({kind:current,id,published})});
        if(!r.ok)throw Error('لم يتم تغيير حالة النشر');
        const row=cache.find(x=>Number(x.id)===Number(id));
        if(row)row.published=published?1:0;
        render();
        await updateStats();
      }catch(e){alert(e.message)}
    }
