<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم الموقع</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Cairo,sans-serif;background:#f6f5f1;color:#15181a}button,input,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1050px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.brand{font-size:22px;font-weight:800}.muted{color:#68706f}.btn{border:0;border-radius:10px;padding:11px 16px;background:#1f5c4a;color:#fff}.btn.secondary{background:#e8e6df;color:#15181a}.btn.danger{background:#a33a3a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card,.form{background:#fff;border:1px solid #ddd8cc;border-radius:16px;padding:18px}.form{margin-bottom:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid #ccc7bb;border-radius:9px;padding:10px;background:#fff}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.login{max-width:430px;margin:12vh auto}.status{padding:10px;border-radius:9px;background:#eee;margin-top:12px}@media(max-width:700px){.fields{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div id="app"></div><script>
const app=document.getElementById('app');let editing=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt){const r=await fetch(url,{...opt,headers:{'content-type':'application/json',...(opt?.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'حدث خطأ');return d}
async function boot(){const m=await fetch('/api/me',{cache:'no-store'}).then(r=>r.json());m.authenticated?dashboard():login()}
function login(){app.innerHTML='<div class="wrap login"><div class="form"><h1>دخول المدير</h1><p class="muted">اكتب كلمة مرور الأدمن التي ضبطتها في Cloudflare.</p><div class="field"><label>كلمة المرور</label><input id="password" type="password" onkeydown="if(event.key===\'Enter\')doLogin()"></div><div class="actions"><button class="btn" onclick="doLogin()">دخول</button></div><div id="msg" class="status"></div></div></div>';document.getElementById('password').focus()}
async function doLogin(){try{await api('/api/login',{method:'POST',body:JSON.stringify({password:document.getElementById('password').value})});dashboard()}catch(e){document.getElementById('msg').textContent=e.message}}
async function logout(){await fetch('/api/logout',{method:'POST'});login()}
async function load(){const r=await fetch('/api/posts',{cache:'no-store'}),data=await r.json();document.getElementById('list').innerHTML=data.map(r=>'<div class="card"><div class="muted">'+esc(r.cat_en)+'</div><h3>'+esc(r.title_en)+'</h3><div>'+esc(r.title_ar)+'</div><div class="muted">'+(r.published?'منشور':'مخفي')+'</div><div class="actions"><button class="btn secondary" onclick=\'editRow('+JSON.stringify(r).replace(/'/g,'&#39;')+')\'>تعديل</button><button class="btn secondary" onclick="toggleRow('+r.id+','+(!r.published)+')">'+(r.published?'إخفاء':'نشر')+'</button><button class="btn danger" onclick="deleteRow('+r.id+')">حذف</button></div></div>').join('')||'<div class="card">لا توجد منشورات.</div>'}
function dashboard(){app.innerHTML='<div class="wrap"><div class="top"><div><div class="brand">لوحة تحكم الموقع</div><div class="muted">إدارة الـ Status / Insights بدون تعديل الكود.</div></div><button class="btn secondary" onclick="logout()">خروج</button></div><div id="form"></div><div class="top"><h2>Posts / Status</h2><button class="btn" onclick="editing={published:1,sort_order:0};showForm()">+ إضافة Status</button></div><div id="list" class="grid"></div></div>';load()}
function editRow(r){editing=r;showForm();scrollTo({top:0,behavior:'smooth'})}
function showForm(){const d=editing||{};document.getElementById('form').innerHTML='<div class="form"><h2>'+(d.id?'تعديل Status':'إضافة Status')+'</h2><div class="fields"><div class="field"><label>Slug</label><input id="slug" value="'+esc(d.slug)+'"></div><div class="field"><label>الترتيب</label><input id="sort_order" type="number" value="'+(d.sort_order??0)+'"></div><div class="field"><label>Category EN</label><input id="cat_en" value="'+esc(d.cat_en)+'"></div><div class="field"><label>Category AR</label><input id="cat_ar" value="'+esc(d.cat_ar)+'"></div><div class="field"><label>Title EN</label><input id="title_en" value="'+esc(d.title_en)+'"></div><div class="field"><label>Title AR</label><input id="title_ar" value="'+esc(d.title_ar)+'"></div><div class="field full"><label>Description EN</label><textarea id="desc_en">'+esc(d.desc_en)+'</textarea></div><div class="field full"><label>Description AR</label><textarea id="desc_ar">'+esc(d.desc_ar)+'</textarea></div><div class="field"><label>Date EN</label><input id="date_en" value="'+esc(d.date_en)+'"></div><div class="field"><label>Date AR</label><input id="date_ar" value="'+esc(d.date_ar)+'"></div><div class="field full"><label>الرابط</label><input id="url" value="'+esc(d.url||'#')+'"></div><div class="field full"><label><input id="published" type="checkbox" '+(d.published!==0?'checked':'')+'> منشور على الموقع</label></div></div><div class="actions"><button class="btn" onclick="save()">حفظ</button><button class="btn secondary" onclick="editing=null;document.getElementById(\'form\').innerHTML=\'\'">إلغاء</button></div><div id="msg" class="status"></div></div>'}
function vals(){return {slug:slug.value.trim(),sort_order:Number(sort_order.value)||0,cat_en:cat_en.value,cat_ar:cat_ar.value,title_en:title_en.value,title_ar:title_ar.value,desc_en:desc_en.value,desc_ar:desc_ar.value,date_en:date_en.value,date_ar:date_ar.value,url:url.value||'#',published:published.checked}}
async function save(){try{const d=vals();if(!d.slug||!d.title_en)throw Error('Slug و Title EN مطلوبان');if(editing?.id)d.id=editing.id;await api('/api/posts',{method:editing?.id?'PUT':'POST',body:JSON.stringify(d)});editing=null;document.getElementById('form').innerHTML='';load()}catch(e){document.getElementById('msg').textContent=e.message}}
async function toggleRow(id,published){try{await api('/api/posts',{method:'PUT',body:JSON.stringify({id,published})});load()}catch(e){alert(e.message)}}
async function deleteRow(id){if(!confirm('حذف المنشور نهائيًا؟'))return;try{await fetch('/api/posts?id='+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}
boot();</script></body></html>
