<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ahmed Elsheshtawy — Admin</title>
<style>
:root{--bg:#f5f3ee;--panel:#fff;--ink:#111416;--muted:#777d7a;--line:#e5e1d8;--accent:#ff4d00;--dark:#111;--soft:#f0eee8;--green:#1f5c4a;--danger:#b53a3a;--shadow:0 14px 45px rgba(17,20,22,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit}.hidden{display:none!important}
.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:#101111;color:#fff;padding:24px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;padding:8px 8px 26px;border-bottom:1px solid #292b2a}.mark{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#050505;display:grid;place-items:center;font-weight:900}.brand strong{font-size:14px}.brand small{display:block;color:#888;font-size:10px;margin-top:3px}.nav{padding-top:22px;display:grid;gap:7px}.nav button{border:0;background:transparent;color:#aaa;text-align:right;padding:13px 14px;border-radius:11px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:650}.nav button:hover,.nav button.active{background:#1c1e1d;color:#fff}.nav button.active{box-shadow:inset -3px 0 0 var(--accent)}.nav .count{font-size:11px;background:#282a29;color:#aaa;padding:3px 7px;border-radius:999px}.sidebar-bottom{margin-top:auto;display:grid;gap:10px}.logout{width:100%;border:1px solid #303231;background:#191b1a;color:#ddd;border-radius:10px;padding:11px}.main{min-width:0}.topbar{height:76px;background:rgba(245,243,238,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:10}.topbar h1{font-size:19px;margin:0}.topbar p{margin:4px 0 0;color:var(--muted);font-size:12px}.user-chip{display:flex;align-items:center;gap:10px}.avatar{width:36px;height:36px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}.content{padding:32px 34px 60px;max-width:1500px}.welcome{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px}.welcome h2{font-size:34px;letter-spacing:-.04em;margin:0 0 7px}.welcome p{color:var(--muted);margin:0}.primary{border:0;background:var(--accent);color:#080808;border-radius:11px;padding:12px 17px;font-weight:800}.primary:hover{transform:translateY(-1px)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:19px;box-shadow:0 4px 16px rgba(0,0,0,.025)}.stat .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.stat strong{display:block;font-size:29px;margin-top:7px}.stat small{color:var(--green);font-size:11px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.search{position:relative;flex:1;max-width:430px}.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px 40px 12px 14px;outline:0}.search span{position:absolute;right:14px;top:11px;color:#999}.sort{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;color:#555}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 5px 22px rgba(0,0,0,.025);transition:.2s}.card:hover{border-color:#cfc9bc;box-shadow:var(--shadow);transform:translateY(-2px)}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.eyebrow{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:800}.card h3{font-size:20px;letter-spacing:-.025em;margin:8px 0 5px}.arabic{color:#737875;font-size:13px}.desc{color:#646b68;font-size:13px;line-height:1.6;margin:12px 0}.status{font-size:10px;padding:5px 9px;border-radius:999px;white-space:nowrap}.status.on{background:#e8f2ed;color:#1f5c4a}.status.off{background:#f1e9e9;color:#a04444}.pills{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.pill{font-size:10px;padding:5px 8px;border-radius:999px;background:var(--soft);color:#666}.meta{border-top:1px solid var(--line);padding-top:13px;margin-top:14px;color:#8a8f8c;font-size:10px;word-break:break-all}.actions{display:flex;gap:7px;margin-top:16px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:700}.btn:hover{background:var(--soft)}.btn.danger{color:var(--danger)}.btn.accent{background:#111;color:#fff;border-color:#111}.empty{grid-column:1/-1;text-align:center;padding:60px 20px;border:1px dashed #cfcac0;border-radius:17px;color:var(--muted);background:rgba(255,255,255,.4)}
.overlay{position:fixed;inset:0;background:rgba(7,8,8,.58);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.overlay.open{display:flex}.modal{background:#f8f7f3;width:min(1000px,100%);max-height:92vh;overflow:auto;border-radius:20px;box-shadow:0 30px 100px rgba(0,0,0,.25)}.modal-head{padding:21px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#f8f7f3;z-index:2}.modal-head h2{margin:0;font-size:20px}.close{border:0;background:#e9e6de;width:36px;height:36px;border-radius:50%;font-size:22px}.form{padding:24px}.section{margin:0 0 24px}.section-title{font-size:12px;font-weight:850;letter-spacing:.04em;text-transform:uppercase;margin-bottom:13px;padding-bottom:9px;border-bottom:1px solid var(--line)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:800;color:#565d5a;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid #d8d3c8;border-radius:9px;background:#fff;padding:10px 11px;outline:0}.field input:focus,.field textarea:focus{border-color:#111;box-shadow:0 0 0 3px rgba(17,17,17,.05)}.field textarea{min-height:88px;resize:vertical}.field textarea.big{min-height:120px}.check{display:flex!important;align-items:center;gap:8px;padding-top:4px}.check input{width:auto}.modal-actions{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:18px;margin-top:6px}.message{padding:10px 12px;border-radius:9px;background:#eee;margin-top:12px;font-size:12px;color:#555}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:#101111}.login-box{width:min(430px,100%);background:#f8f7f3;border-radius:20px;padding:30px;box-shadow:0 30px 90px rgba(0,0,0,.3)}.login-logo{width:48px;height:48px;border-radius:14px;background:var(--accent);display:grid;place-items:center;font-weight:900;margin-bottom:20px}.login-box h1{margin:0;font-size:27px}.login-box p{color:var(--muted);font-size:13px;line-height:1.6}.login-box .field{margin-top:15px}.login-box .primary{width:100%;margin-top:17px;padding:13px}.login-error{background:#f5e9e9;color:#9d3c3c;border-radius:9px;padding:10px;margin-top:12px;font-size:12px}
@media(max-width:1000px){.shell{grid-template-columns:82px 1fr}.sidebar{padding:18px 10px}.brand div:last-child,.nav button span.label,.sidebar-bottom{display:none}.brand{justify-content:center;border:0}.nav button{justify-content:center;padding:13px}.nav .count{display:none}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.shell{display:block}.sidebar{height:auto;position:static;display:flex;flex-direction:row;padding:10px 12px;align-items:center}.brand{padding:0;border:0}.nav{padding:0;margin-right:auto;display:flex}.nav button{width:44px;height:44px}.topbar{padding:0 17px}.content{padding:22px 16px 50px}.welcome{align-items:flex-start;flex-direction:column}.welcome h2{font-size:28px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar{align-items:stretch;flex-direction:column}.search{max-width:none}}
</style></head>
<body><div id="app"></div><div id="modalOverlay" class="overlay"><div class="modal"><div class="modal-head"><h2 id="modalTitle">إضافة</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
const app=document.getElementById('app');let current='projects',editing=null,cache=[],query='';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'content-type':'application/json',...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'حدث خطأ');return d}
async function boot(){const m=await fetch('/api/me',{cache:'no-store'}).then(r=>r.json());m.authenticated?dashboard():login()}
function login(){app.innerHTML='<div class="login-wrap"><div class="login-box"><div class="login-logo">AE</div><h1>لوحة تحكم الموقع</h1><p>إدارة المشاريع والفيديوهات والـ Status من مكان واحد.</p><div class="field"><label>اسم المستخدم</label><input id="username" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><button class="primary" onclick="doLogin()">دخول لوحة التحكم</button><div id="loginError" class="login-error hidden"></div></div></div>';['username','password'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()}));document.getElementById('username').focus()}
async function doLogin(){const e=document.getElementById('loginError');e.classList.add('hidden');try{await api('/api/login',{method:'POST',body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});dashboard()}catch(x){e.textContent=x.message;e.classList.remove('hidden')}}
async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}
function dashboard(){app.innerHTML='<div class="shell"><aside class="sidebar"><div class="brand"><div class="mark">AE</div><div><strong>Ahmed Elsheshtawy</strong><small>Content Management</small></div></div><div class="nav"><button id="nav-projects" onclick="switchTab(\'projects\')"><span class="label">📊 المشاريع</span><span class="count" id="count-projects">0</span></button><button id="nav-videos" onclick="switchTab(\'videos\')"><span class="label">🎥 الفيديوهات</span><span class="count" id="count-videos">0</span></button><button id="nav-posts" onclick="switchTab(\'posts\')"><span class="label">📝 Status / Insights</span><span class="count" id="count-posts">0</span></button></div><div class="sidebar-bottom"><button class="logout" onclick="logout()">خروج</button></div></aside><main class="main"><header class="topbar"><div><h1 id="pageTitle">المشاريع</h1><p>إدارة محتوى موقعك بدون تعديل الكود</p></div><div class="user-chip"><span>Admin</span><div class="avatar">AE</div></div></header><section class="content"><div class="welcome"><div><h2 id="welcomeTitle">مشاريعك</h2><p id="welcomeSub">أهم أعمالك ودراسات الحالة.</p></div><button class="primary" onclick="newRow()" id="addBtn">+ إضافة مشروع</button></div><div class="stats"><div class="stat"><span class="label">المشاريع</span><strong id="statProjects">—</strong><small>إجمالي العناصر</small></div><div class="stat"><span class="label">الفيديوهات</span><strong id="statVideos">—</strong><small>إجمالي العناصر</small></div><div class="stat"><span class="label">Status / Insights</span><strong id="statPosts">—</strong><small>إجمالي العناصر</small></div><div class="stat"><span class="label">منشور الآن</span><strong id="statPublished">—</strong><small>عناصر ظاهرة على الموقع</small></div></div><div class="toolbar"><div class="search"><span>⌕</span><input id="search" placeholder="ابحث بالعنوان أو التصنيف..." oninput="query=this.value;render()"></div><select class="sort" id="sort" onchange="render()"><option value="sort">حسب الترتيب</option><option value="title">حسب العنوان</option><option value="status">حسب الحالة</option></select></div><div id="contentGrid" class="grid"></div></section></main></div>';switchTab('projects')}
const configs={projects:{endpoint:'/api/projects',title:'المشاريع',welcome:'مشاريعك',sub:'أهم أعمالك ودراسات الحالة.',add:'+ إضافة مشروع',fields:[['slug','Slug','text'],['sort_order','الترتيب','number'],['cat_en','Category EN','text'],['cat_ar','Category AR','text'],['title_en','Title EN','text'],['title_ar','Title AR','text'],['desc_en','Description EN','textarea'],['desc_ar','Description AR','textarea'],['tags','Tags','text'],['model_url','Model Image URL','text'],['dashboard_url','Dashboard Image URL','text'],['overview_en','Overview EN','textarea'],['overview_ar','نظرة عامة AR','textarea'],['problem_en','Business Problem EN','textarea'],['problem_ar','مشكلة العمل AR','textarea'],['objective_en','Objective EN','textarea'],['objective_ar','الهدف AR','textarea'],['data_en','Data & Assumptions EN','textarea'],['data_ar','البيانات والافتراضات AR','textarea'],['analysis_en','Analysis EN','textarea'],['analysis_ar','التحليل AR','textarea'],['findings_en','Key Findings EN','textarea'],['findings_ar','أهم النتائج AR','textarea'],['lessons_en','Lessons Learned EN','textarea'],['lessons_ar','الدروس المستفادة AR','textarea']]},videos:{endpoint:'/api/videos',title:'الفيديوهات',welcome:'فيديوهاتك',sub:'المحتوى المرئي الظاهر على الموقع.',add:'+ إضافة فيديو',fields:[['slug','Slug','text'],['sort_order','الترتيب','number'],['category_en','Category EN','text'],['category_ar','Category AR','text'],['title_en','Title EN','text'],['title_ar','Title AR','text'],['desc_en','Description EN','textarea'],['desc_ar','Description AR','textarea'],['url','YouTube / Video URL','text'],['thumbnail_url','Thumbnail URL','text'],['duration','Duration (e.g. 08:12)','text']]},posts:{endpoint:'/api/posts',title:'Status / Insights',welcome:'Status & Insights',sub:'منشوراتك وتحديثاتك المهنية.',add:'+ إضافة Status',fields:[['slug','Slug','text'],['sort_order','الترتيب','number'],['cat_en','Category EN','text'],['cat_ar','Category AR','text'],['title_en','Title EN','text'],['title_ar','Title AR','text'],['desc_en','Description EN','textarea'],['desc_ar','Description AR','textarea'],['date_en','Date EN','text'],['date_ar','Date AR','text'],['url','الرابط','text']]}};
async function switchTab(t){current=t;query='';editing=null;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('nav-'+t).classList.add('active');const c=configs[t];document.getElementById('pageTitle').textContent=c.title;document.getElementById('welcomeTitle').textContent=c.welcome;document.getElementById('welcomeSub').textContent=c.sub;document.getElementById('addBtn').textContent=c.add;document.getElementById('search').value='';await load()}
async function load(){try{cache=await api(configs[current].endpoint);updateStats();render()}catch(e){document.getElementById('contentGrid').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function updateStats(){const get=t=>t===current?cache.length:null;const counts={projects:document.getElementById('count-projects'),videos:document.getElementById('count-videos'),posts:document.getElementById('count-posts')};if(counts[current])counts[current].textContent=cache.length; // refresh other counters quietly
Promise.all(Object.keys(configs).filter(t=>t!==current).map(async t=>{try{const d=await api(configs[t].endpoint);document.getElementById('count-'+t).textContent=d.length;document.getElementById('stat'+(t==='projects'?'Projects':t==='videos'?'Videos':'Posts')).textContent=d.length;return d}catch{return[]}})).then(ds=>{document.getElementById('statProjects').textContent=current==='projects'?cache.length:(ds.find((_,i)=>Object.keys(configs).filter(t=>t!==current)[i]==='projects')||[]).length;});document.getElementById('stat'+(current==='projects'?'Projects':current==='videos'?'Videos':'Posts')).textContent=cache.length;document.getElementById('statPublished').textContent=cache.filter(x=>x.published).length}
function render(){let data=cache.filter(r=>{const q=query.trim().toLowerCase();return !q||[r.title_en,r.title_ar,r.cat_en,r.cat_ar,r.category_en,r.category_ar].join(' ').toLowerCase().includes(q)});const mode=document.getElementById('sort').value;if(mode==='title')data.sort((a,b)=>String(a.title_en).localeCompare(String(b.title_en)));if(mode==='status')data.sort((a,b)=>b.published-a.published);document.getElementById('contentGrid').innerHTML=data.length?data.map(card).join(''):'<div class="empty">لا توجد عناصر مطابقة.</div>'}
function card(r){const title=r.title_en||'';const cat=r.cat_en||r.category_en||'';const tags=current==='projects'?String(r.tags||'').split(',').filter(Boolean).slice(0,5).map(x=>'<span class="pill">'+esc(x.trim())+'</span>').join(''):'';let meta='';if(current==='videos')meta=(r.url?'<div class="meta">'+esc(r.url)+'</div>':'');if(current==='projects')meta='<div class="meta">'+(r.model_url?'Model: '+esc(r.model_url)+'<br>':'')+(r.dashboard_url?'Dashboard: '+esc(r.dashboard_url):'')+'</div>';return '<article class="card"><div class="card-head"><div><div class="eyebrow">'+esc(cat)+'</div><h3>'+esc(title)+'</h3><div class="arabic">'+esc(r.title_ar)+'</div></div><span class="status '+(r.published?'on':'off')+'">'+(r.published?'منشور':'مخفي')+'</span></div><p class="desc">'+esc(r.desc_en||r.desc_ar||'')+'</p><div class="pills">'+tags+'</div>'+meta+'<div class="actions"><button class="btn accent" onclick=\'editRow('+JSON.stringify(r).replace(/'/g,'&#39;')+')\'>تعديل</button><button class="btn" onclick="toggleRow('+r.id+','+(!r.published)+')">'+(r.published?'إخفاء':'نشر')+'</button><button class="btn danger" onclick="deleteRow('+r.id+')">حذف</button></div></article>'}
function newRow(){editing={published:1,sort_order:0};showForm()}
function editRow(r){editing=r;showForm()}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open')}
function field(key,label,type,d){const v=d[key]??'';if(type==='textarea')return '<div class="field"><label>'+label+'</label><textarea id="f_'+key+'">'+esc(v)+'</textarea></div>';return '<div class="field"><label>'+label+'</label><input id="f_'+key+'" type="'+type+'" value="'+esc(v)+'"></div>'}
function showForm(){const c=configs[current],d=editing||{};let basic='',details='';c.fields.forEach(f=>{const html=field(f[0],f[1],f[2],d);if(current==='projects'&&['overview_en','overview_ar'].includes(f[0]))details+=html;else if(current==='projects'&&['problem_en','problem_ar','objective_en','objective_ar','data_en','data_ar','analysis_en','analysis_ar','findings_en','findings_ar','lessons_en','lessons_ar'].includes(f[0]))details+=html;else basic+=html});let html='<div class="form"><div class="section"><div class="section-title">المعلومات الأساسية</div><div class="fields">'+basic+'</div></div>';if(current==='projects')html+='<div class="section"><div class="section-title">تفاصيل دراسة الحالة</div><div class="fields">'+details+'</div></div>';html+='<div class="field"><label class="check"><input id="f_published" type="checkbox" '+(d.published!==0?'checked':'')+'> منشور على الموقع</label></div><div class="modal-actions"><button class="btn" onclick="closeModal()">إلغاء</button><button class="primary" onclick="save()">حفظ التغييرات</button></div><div id="formMsg" class="message hidden"></div></div>';document.getElementById('modalTitle').textContent=(d.id?'تعديل ':'إضافة ')+c.title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modalOverlay').classList.add('open');document.querySelector('#modalBody input')?.focus()}
function vals(){const c=configs[current],o={};c.fields.forEach(f=>{const el=document.getElementById('f_'+f[0]);o[f[0]]=f[2]==='number'?Number(el.value)||0:el.value});o.published=document.getElementById('f_published').checked;return o}
async function save(){const msg=document.getElementById('formMsg');msg.classList.add('hidden');try{const d=vals();if(!d.slug||!d.title_en)throw Error('Slug و Title EN مطلوبان');if(current==='videos'&&!d.url)throw Error('رابط الفيديو مطلوب');if(editing?.id)d.id=editing.id;const c=configs[current];await api(c.endpoint,{method:editing?.id?'PUT':'POST',body:JSON.stringify(d)});closeModal();load()}catch(e){msg.textContent=e.message;msg.classList.remove('hidden')}}
async function toggleRow(id,published){try{await api(configs[current].endpoint,{method:'PUT',body:JSON.stringify({id,published})});load()}catch(e){alert(e.message)}}
async function deleteRow(id){if(!confirm('هل تريد حذف العنصر نهائيًا؟'))return;try{await fetch(configs[current].endpoint+'?id='+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}
boot();
</script></body></html>
